name: Update notebook count

on:
  push:
    branches: [main]
    paths:
      - '**/*.ipynb'
      - '.github/workflows/notebook-count.yml'
      - '.github/badges/notebooks.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notebook-count
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Count tracked notebooks
        shell: python
        run: |
          import json
          from pathlib import Path, PurePosixPath
          import subprocess

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          count = sum(
              path.endswith('.ipynb') and '.ipynb_checkpoints' not in PurePosixPath(path).parts
              for path in paths
          )
          badge = {
              'schemaVersion': 1, 'label': 'notebooks', 'message': str(count),
              'color': 'orange', 'cacheSeconds': 300,
          }
          target = Path('.github/badges/notebooks.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(badge, indent=2) + '\n', encoding='utf-8')
          print(f'Notebooks: {count}')

      - name: Commit updated count
        run: |
          if git diff --quiet -- .github/badges/notebooks.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/badges/notebooks.json
          git commit -m 'Update notebook count badge'
          git push origin HEAD:main
